<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EEF5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>Nestwell</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nestwell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ============================================================
   tokens.css — 색 / 간격 / 글꼴
   ============================================================ */
:root{
  /* 정본: ~/life/brand/brand.json — 색을 바꿀 땐 거기부터 고치고 여기 옮긴다 */
  --bg:#E8EEF5;        /* 색.바탕 — 옅은 하늘 파스텔 */
  --bg-2:#D8E4F0;      /* 색.바탕2 */
  --card:#F8FAFC;      /* 앱.카드 */
  --on:#F8FAFC;        /* 짙은 색 위 글자 */
  --ink:#14213D;       /* 앱.본문 */
  --ink-2:#46566C;     /* 앱.보조글자 */
  --ink-3:#7F8DA3;     /* 앱.장식 — 글자에 쓰지 않는다 */
  --line:#C9D5E3;      /* 앱.선 */
  --line-soft:#D8E4F0; /* 색.바탕2 */

  --primary:#23336E;   /* 색.주 — 은하 */
  --sub:#2A6CB8;       /* 색.보조 — 하늘 */
  --accent:#9ADCE2;    /* 색.강조 — 빙하. 한 화면에 한 자리 */

  --meal:#8E560A;  --meal-bg:#F5EAD8;   /* 기능색.식단 */
  --work:#0F6873;  --work-bg:#D8EEF0;   /* 기능색.운동 */
  --money:#2A6CB8; --money-bg:#E8F0F9;  /* 기능색.돈 */
  --warn:#A3392B;  --warn-bg:#F7E3DF;   /* 기능색.경고 */
  --hobby:#6B4FA6; --hobby-bg:#ECE6F6;  /* 기능색.취미 */
  --job:#4A4F8F;   --job-bg:#E4E5F3;    /* 기능색.근무 */

  --r-lg:20px; --r-md:14px; --r-sm:10px;  /* 규격.큰모서리 / 모서리 */
  --pad:16px;
  --tap:44px;                              /* 규격.버튼높이 */
  --tab-h:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer}
input{background:none}

/* ============================================================
   base + shell
   ============================================================ */
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 10px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
header.top.scrolled{border-color:var(--line)}
.top-title{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.1;color:var(--primary)}
.top-sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.dots{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink-2);background:var(--card)}

main{flex:1;padding:6px var(--pad) calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}

/* 하단 탭 */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:520px;margin:0 auto;
  background:rgba(248,250,252,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);font-size:13px;font-weight:600}
nav.tabs button .ic{display:grid;place-items:center;line-height:1}
nav.tabs button[aria-current="true"]{color:var(--primary)}
nav.tabs button[aria-current="true"] .ic{transform:translateY(-1px)}

/* 세그먼트(탭 내부) */
.seg{display:flex;gap:4px;background:var(--bg-2);padding:4px;border-radius:12px;margin:2px 0 16px}
.seg button{flex:1;min-height:var(--tap);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,61,.1)}

/* 카드 */
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-bottom:12px}
.card.flat{padding:14px 16px;border-radius:var(--r-md)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-label{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.big.sm{font-size:26px}
.unit{font-size:15px;font-weight:700;color:var(--ink-2);margin-left:2px}
.muted{color:var(--ink-2);font-size:14px}
.tiny{font-size:13px;color:var(--ink-2)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:700}
.chip.meal{background:var(--meal-bg);color:var(--meal)}
.chip.work{background:var(--work-bg);color:var(--work)}
.chip.money{background:var(--money-bg);color:var(--money)}
.chip.off{background:var(--bg-2);color:var(--ink-2)}
.chip.job{background:var(--job-bg);color:var(--job)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:12px 16px;border-radius:var(--r-md);font-weight:700;font-size:15px}
.btn.full{width:100%}
.btn.meal{background:var(--meal);color:var(--on)}
.btn.work{background:var(--work);color:var(--on)}
.btn.money{background:var(--money);color:var(--on)}
.btn.ghost{background:var(--bg-2);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--ink)}
.btn.line{border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-weight:600}
.btn:active{transform:scale(.985)}

/* 진행바 */
.bar{height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--work);transition:width .3s ease}

/* 체크 행 */
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:transparent;background:var(--card)}
.row.on .tick{background:var(--work);border-color:var(--work);color:var(--on)}
.row.on .r-name{color:var(--ink-2);text-decoration:line-through}
.r-name{font-weight:650;font-size:15px}
.r-meta{font-size:13px;color:var(--ink-2);margin-top:2px}

/* 오늘 스케줄 타임라인 */
.sched .srow{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line-soft)}
.sched .srow:last-child{border-bottom:none}
.sched .stime{width:72px;flex:none;font-size:13px;font-weight:700;color:var(--ink-2);padding-top:2px;font-variant-numeric:tabular-nums}
.sched .sdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.sched .slabel{font-size:14px;font-weight:600}
.sched .srow.now{background:var(--work-bg);border-radius:10px;margin:0 -6px;padding:8px 6px}
.sched .srow.now .slabel{color:var(--work);font-weight:800}
.sched .srow.now .stime{color:var(--work)}

/* 입력 */
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
.inp:focus{outline:2px solid var(--money);outline-offset:-1px;border-color:transparent}
.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}

/* 시트 / 모달 */
.scrim{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:20px var(--pad) calc(env(safe-area-inset-bottom) + 20px);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.sheet.on{transform:translateY(0)}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800;letter-spacing:-.4px}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 14px;border-radius:var(--r-md);background:var(--bg);margin-bottom:8px;font-weight:650;text-align:left;min-height:var(--tap)}
.opt[aria-current="true"]{background:var(--work-bg);color:var(--work)}

.ico{flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
.inp:focus-visible{outline-offset:-1px}
#syncBadge{min-height:var(--tap);padding:0 14px}
[data-del]{min-width:var(--tap);min-height:var(--tap)}
[data-fold]{min-height:var(--tap)}
.field{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .22s ease}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <div>
      <div class="top-title" id="topTitle">Nestwell</div>
      <div class="top-sub" id="topSub"></div>
    </div>
    <button class="chip off" id="syncBadge" hidden></button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><span class="ic" data-ic="house"></span>홈</button>
    <button data-tab="meal"><span class="ic" data-ic="utensils"></span>식단</button>
    <button data-tab="work"><span class="ic" data-ic="dumbbell"></span>운동</button>
    <button data-tab="money"><span class="ic" data-ic="wallet"></span>돈</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<script src="sync.js?v=1df51e4e"></script>
<script src="review.js?v=48d0577c"></script>

<script>
/* ============================================================
   shared/icons.js — Lucide 0.460 (ISC) 경로를 인라인으로
   ============================================================ */
const ICON = {
  house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/> <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/> <path d="M7 2v20"/> <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  dumbbell: '<path d="M14.4 14.4 9.6 9.6"/> <path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/> <path d="m21.5 21.5-1.4-1.4"/> <path d="M3.9 3.9 2.5 2.5"/> <path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/> <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  calendar: '<path d="M8 2v4"/> <path d="M16 2v4"/> <rect width="18" height="18" x="3" y="4" rx="2"/> <path d="M3 10h18"/> <path d="M8 14h.01"/> <path d="M12 14h.01"/> <path d="M16 14h.01"/> <path d="M8 18h.01"/> <path d="M12 18h.01"/> <path d="M16 18h.01"/>',
  review: '<path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/> <path d="M2 6h4"/> <path d="M2 10h4"/> <path d="M2 14h4"/> <path d="M2 18h4"/> <path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/>',
  work: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/> <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/> <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/> <path d="M10 6h4"/> <path d="M10 10h4"/> <path d="M10 14h4"/> <path d="M10 18h4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/> <path d="m6 6 12 12"/>',
  plus: '<path d="M5 12h14"/> <path d="M12 5v14"/>'
};
const ic = (name, size=18) => `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

/* ============================================================
   shared/storage.js — localStorage 캐시 + GitHub(sasaway/life) 동기화 (sync.js)
   ============================================================ */
const SYNC_CFG = 'lifesync:config';
let storageMode = 'local';   // 'memory' 면 새로고침 때 설정이 사라진다
const storage = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; }
  catch (e) { storageMode = 'memory'; const m = new Map(); return { getItem: k => m.has(k) ? m.get(k) : null, setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k) }; }
})();
const syncCfg = (() => { try { return JSON.parse(storage.getItem(SYNC_CFG)); } catch (e) { return null; } })();
const store = LifeSync.createStore({
  api: syncCfg ? LifeSync.githubApi({ token: syncCfg.token, repo: syncCfg.repo }) : null,
  storage,
  device: syncCfg ? syncCfg.device : '로컬',
  onRemoteChange: () => { loadAll().then(render); },
});
const DB = {
  async get(key){ return store.get(key); },
  async set(key,val){ store.set(key,val); },
  async del(key){ storage.removeItem('lifesync:cache:'+key); }   // v6 에서 부르는 곳 없음
};
const K = {
  settings:'living-routine:v1:settings',
  meals: ym => `living-routine:v1:meals:${ym}`,
  work:  ym => `living-routine:v1:workouts:${ym}`,
  money: ym => `living-routine:v1:budget:${ym}`,
  review: ym => `living-routine:v1:review:${ym}`
};

/* ============================================================
   shared/formatters.js
   ============================================================ */
const won = n => (Number(n)||0).toLocaleString('ko-KR');
const pad2 = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const ymOf = s => s.slice(0,7);
const DOW = ['일','월','화','수','목','금','토'];
const TODAY = ymd(new Date());
const fmtDate = s => { const d = new Date(s+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };
const dowOf = s => new Date(s+'T00:00:00').getDay();
const uid = p => p+'-'+Math.random().toString(36).slice(2,8);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowHM = () => { const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };

/* ============================================================
   app/schedule.js — 격주 오픈/마감 시프트 엔진
   기준: 2026-09-14(월) = 오픈반 시작 주. 2주 주기로 오픈↔마감 반복.
   오픈반 주 휴무 = 수요일 / 마감반 주 휴무 = 일요일 (은월 확인 완료)
   운동은 매일 하되 강도가 요일마다 다르다(PLANS 참고) — 그래서 시간표는
   '몇 시에 운동하는지'만 정하고, '무엇을 얼마나'는 PLANS가 정한다.
   슬롯은 오픈반 16:15 / 마감반 12:00으로 고정.
   ============================================================ */
const SCHEDULE_ANCHOR = '2026-09-14';
const OFF_DOW = { open:3, close:0 };
const WORK_HOURS = { open:{start:'08:30',end:'15:30'}, close:{start:'15:00',end:'22:00'} };
const WORKOUT_SLOT = { open:{start:'16:00',end:'18:00'}, close:{start:'11:00',end:'13:00'} };
const SHOWER_SLOT = { open:{start:'18:00',end:'18:30'}, close:{start:'13:00',end:'13:30'} };
const CAT_COLOR = { sleep:'var(--ink-3)', meal:'var(--meal)', hobby:'var(--hobby)', work:'var(--job)', workout:'var(--work)', chore:'var(--ink-2)', free:'var(--ink-3)', care:'var(--money)' };

const SCHEDULE_TEMPLATES = {
  /* 오픈반 · 근무일 (수요일 제외) — 운동 16:00 출발~18:00 귀가(2시간), 샤워 30분, 취미 2시간 */
  'open|work': [
    ['07:00','07:20','기상 · 세면','sleep'],
    ['07:20','07:35','아침 (간단)','meal'],
    ['07:35','08:30','자유시간','free'],
    ['08:30','15:30','알바 · 오픈반','work'],
    ['15:30','16:00','귀가 · 휴식','free'],
    ['16:00','18:00','운동 (왕복 포함)','workout'],
    ['18:00','18:30','샤워','care'],
    ['18:30','19:15','저녁','meal'],
    ['19:15','19:45','가사','chore'],
    ['19:45','21:45','취미','hobby'],
    ['21:45','22:30','자유시간','free'],
    ['22:30','23:30','스킨케어 · 준비','care'],
    ['23:30','24:00','마무리','free']
  ],
  /* 오픈반 · 휴무 (수) — 운동 시각은 근무일과 동일하게 유지 */
  'open|off': [
    ['07:00','07:20','기상 · 세면','sleep'],
    ['07:20','07:35','아침 (간단)','meal'],
    ['07:35','11:30','자유시간','free'],
    ['11:30','12:00','가사','chore'],
    ['12:00','16:00','자유시간','free'],
    ['16:00','18:00','운동 (왕복 포함)','workout'],
    ['18:00','18:30','샤워','care'],
    ['18:30','19:15','저녁','meal'],
    ['19:15','21:15','취미','hobby'],
    ['21:15','22:30','자유시간','free'],
    ['22:30','23:30','스킨케어 · 준비','care'],
    ['23:30','24:00','마무리','free']
  ],
  /* 마감반 · 근무일 (일요일 제외) — 운동 11:00 출발~13:00 귀가(2시간), 샤워 30분, 취미 2시간 */
  'close|work': [
    ['07:00','07:20','기상 · 세면','sleep'],
    ['07:20','07:35','아침 (간단)','meal'],

const Schedule = {
  weekIndex(date){
    const a = new Date(SCHEDULE_ANCHOR+'T00:00:00');
    const d = new Date(date+'T00:00:00');
    return Math.floor(Math.round((d-a)/86400000)/7);
  },
  shiftOf(date){ const i=this.weekIndex(date); return (((i%2)+2)%2===0) ? 'open' : 'close'; },
  shiftLabel(s){ return s==='open' ? '오픈반' : '마감반'; },
  isOffDay(date){ return dowOf(date) === OFF_DOW[this.shiftOf(date)]; },
  workHours(date){ return this.isOffDay(date) ? null : WORK_HOURS[this.shiftOf(date)]; },
  workoutSlot(date){ return WORKOUT_SLOT[this.shiftOf(date)]; },
  showerSlot(date){ return SHOWER_SLOT[this.shiftOf(date)]; },
  mealsToday(date){
    if(this.isOffDay(date)) return ['breakfast','lunch','dinner'];
    return this.shiftOf(date)==='open' ? ['breakfast','dinner'] : ['breakfast','lunch'];
  },
  templateKey(date){ return `${this.shiftOf(date)}|${this.isOffDay(date)?'off':'work'}`; },
  blocksFor(date){ return SCHEDULE_TEMPLATES[this.templateKey(date)] || SCHEDULE_TEMPLATES['open|work']; }
};

/* 이전: 날짜×슬롯으로 고정 계산해서, 근무 중 해결하는 끼니의 메뉴가 그냥 버려졌다.
   이후: 실제로 집에서 먹는 끼니(점심/저녁 중 tracked인 것)만 순서대로 세어
   로테이션을 매긴다. 근무 중 해결하는 슬롯은 카운트에서 빠지므로,
   그 자리에 올 예정이던 메뉴가 자동으로 다음 집밥 끼니로 넘어간다. */
function rotationIndexUpTo(date, slot){
  let count = 0;
  const target = new Date(date+'T00:00:00');
  const d = new Date(MEAL_EPOCH);
  while(d < target){
    count += Schedule.mealsToday(ymd(d)).filter(s=>s!=='breakfast').length;
    d.setDate(d.getDate()+1);
  }
  if(slot==='dinner' && Schedule.mealsToday(date).includes('lunch')) count += 1;
  return count;
}
function rotationMenuId(date, slot){
  return MENUS[rotationIndexUpTo(date,slot) % MENUS.length].id;
}
function mealOf(date, slot){
  const store = state.mealCache[ymOf(date)] || {};
  const rec = (store[date]||{})[slot] || {};
  if(slot==='breakfast') return { done: !!rec.done };
  if(!Schedule.mealsToday(date).includes(slot)) return { done: !!rec.done, menuId:null };
  return { menuId: rec.menuId || rotationMenuId(date,slot), done: !!rec.done };
}
function setMeal(date, slot, patch){
  if(!state.meals[date]) state.meals[date] = {};
  const cur = mealOf(date,slot);
  state.meals[date][slot] = { menuId: cur.menuId, done: cur.done, ...patch };
  state.mealCache[state.monthKey] = state.meals;
  saveMeals();
}
function todayMealSummary(){
  const tracked = Schedule.mealsToday(TODAY);
  const b = mealOf(TODAY,'breakfast');
  const l = mealOf(TODAY,'lunch'), d = mealOf(TODAY,'dinner');
  return { tracked, breakfast:b, lunch:{...l, menu:menuById(l.menuId)}, dinner:{...d, menu:menuById(d.menuId)} };
}

/* ============================================================
   features/workout/service.js — 매일 운동, 강도는 요일이 결정
   ============================================================ */
const activePlan = () => PLANS[state.settings.activePlan];
function isWorkoutDay(){ return true; } // 매일 운동한다 — 요일별로 강도만 다르다
function routineFor(date){
  const p = activePlan();
  const s = p.split[dowOf(date)];
  const warmup = (s && s.warmup) || p.warmup;
  const cardio = (s && s.cardio !== undefined) ? s.cardio : p.cardio;
  const cooldown = (s && s.cooldown) || p.cooldown;
  return { title: s.label, intensity: s.intensity, groups:[
    {key:'warmup', label:'준비운동', items:warmup},
    {key:'main',   label:'본운동',   items:s.ex},
    {key:'cardio', label:'유산소',   items:cardio},
    {key:'cool',   label:'마무리 스트레칭', items:cooldown}
  ]};
}
function workRec(date){
  if(!state.work[date]) state.work[date] = { plan:state.settings.activePlan, done:{}, rpe:null };
  return state.work[date];
}
function workProgress(date){
  const r = routineFor(date), rec = state.work[date] || {done:{}};
  let total=0, done=0, mainTotal=0, mainDone=0;
  r.groups.forEach(g=>g.items.forEach(it=>{
    total++; const ok = !!rec.done[it.id]; if(ok) done++;
    if(g.key==='main'){ mainTotal++; if(ok) mainDone++; }
  }));
  return {total,done,mainTotal,mainDone,pct: total? Math.round(done/total*100):0};
}

/* ============================================================
   features/budget/service.js
   ============================================================ */
const catById = id => state.budget.categories.find(c=>c.id===id);
const sumCat = (cat,field) => cat.items.reduce((a,i)=>a+(Number(i[field])||0),0);
function catNet(cat){ return (+cat.actual||0) - (+cat.discount||0); }
function totals(b){
  const cs = b ? b.categories : state.budget.categories;
  return cs.reduce((a,c)=>({
    planned: a.planned + c.items.reduce((x,i)=>x+(+i.planned||0),0),
    actual:  a.actual  + ((c.actual!==undefined) ? (+c.actual||0) : sumCat(c,'actual')),
    discount:a.discount+ ((c.discount!==undefined) ? (+c.discount||0) : sumCat(c,'discount'))
  }),{planned:0,actual:0,discount:0});
}
function livingLeft(){
  const c = catById('living'); if(!c) return 0;
  return sumCat(c,'planned') - catNet(c);
}

    const active = now>=s && now<e;
    const text = cat==='workout' ? `${label} · ${r.title} (${INTENSITY_LABEL[r.intensity]})` : label;
    return `<div class="srow ${active?'now':''}">
      <div class="stime">${s}</div>
      <div class="sdot" style="background:${CAT_COLOR[cat]}"></div>
      <div class="slabel">${esc(text)}</div>

  return `
  <section class="card">
    <div class="card-head">
      <div class="card-label">${ic('calendar')} 오늘 스케줄</div>
      <span class="chip ${off?'off':'job'}">${Schedule.shiftLabel(shift)}${off?' · 휴무':''}</span>
    </div>
    <div class="sched">${rows}</div>
  </section>`;
}

/* 타이머 */
let timerId = null;
function startTimer(sec, elId){
  if(timerId) clearInterval(timerId);
  let left = sec;
  const el = document.getElementById(elId);
  const tick = ()=>{
    if(!document.getElementById(elId)){ clearInterval(timerId); return; }
    const mm = Math.floor(left/60), ss = left%60;
    document.getElementById(elId).textContent = `${mm}:${pad2(ss)}`;
    if(left<=0){ clearInterval(timerId); document.getElementById(elId).textContent='완료!'; }
    left--;
  };
  tick(); timerId = setInterval(tick,1000);
}

        ${c.items.length===0? `<div class="muted" style="font-size:14px;padding:4px 0 8px">아직 항목이 없다. 계획할 금액을 항목으로 추가해보자.</div>`:''}
        <button class="btn line full" style="margin-top:12px" data-additem="${c.id}">항목 추가</button>
      </div>`:''}
    </section>`;
  };
  return `
  <section class="card" style="background:var(--money);color:var(--on)">
    <div class="card-label" style="color:var(--on)">이번 달 예산 합계</div>
    <div class="big" style="margin-top:6px">${won(t.planned)}<span class="unit" style="color:var(--on)">원</span></div>
    <div class="tiny" style="color:var(--on);margin-top:10px">카테고리별 계획을 더한 값이다. 실제 사용액과 할인은 결산 탭에서 입력한다.</div>
  </section>
  ${order.map(id=>catCard(catById(id))).filter(Boolean).join('')}`;
}
function moneyClose(){
  const t = totals(), netActual = t.actual - t.discount, diff = t.planned - netActual;
  const order = ['fixed','subscription','living','extra'];
  const closeCard = c => {
    const planned = sumCat(c,'planned');
    return `
    <section class="card">
      <div class="card-head">
        <div class="card-label">${c.emoji} ${esc(c.name)}</div>
        <div class="tiny">예산 ${won(planned)}원</div>
      </div>
      <div style="display:flex;gap:8px">
        <label style="flex:1"><div class="tiny" style="margin-bottom:3px">실제 사용액</div>
          <input class="inp num" type="number" inputmode="numeric" value="${+c.actual||0}" data-close-amt="actual|${c.id}"></label>
        <label style="flex:1"><div class="tiny" style="margin-bottom:3px;color:var(--money)">할인</div>
          <input class="inp num" type="number" inputmode="numeric" value="${+c.discount||0}" data-close-amt="discount|${c.id}"></label>
      </div>
      <div class="tiny" style="margin-top:8px">순 사용액 ${won(catNet(c))}원</div>
    </section>`;
  };
  return `
  <section class="card" style="background:var(--money);color:var(--on)">
    <div class="card-label" style="color:var(--on)">이번 달 결산</div>
    <div class="big" style="margin-top:6px">${diff>=0?'+':''}${won(diff)}<span class="unit" style="color:var(--on)">원</span></div>
    <div class="tiny" style="color:var(--on);margin-top:10px">예산 ${won(t.planned)}원 · 실제 ${won(netActual)}원 ${diff>=0?'(남김)':'(초과)'}</div>
  </section>
  ${order.map(id=>closeCard(catById(id))).filter(Boolean).join('')}
  <div class="tiny" style="margin:4px 2px 16px">카드·계좌 내역을 보고 월중 언제든 직접 입력하면 된다. 예산 탭의 계획 금액과는 별개로 저장된다.</div>
  ${prevMonthSummary()}`;
}
function prevMonthSummary(){
  const prev = state.prevBudget;
  if(!prev) return `<section class="card">
    <div class="card-label">${state.prevYm.replace('-','년 ')}월 결산</div>
    <div class="muted" style="margin-top:8px">저장된 예산이 없다. 이번 달 결산을 입력해두면 다음 달에 여기서 비교해볼 수 있다.</div>
  </section>`;
  const catA = c => (c.actual!==undefined) ? (+c.actual||0) : sumCat(c,'actual');
  const catD = c => (c.discount!==undefined) ? (+c.discount||0) : sumCat(c,'discount');
  const rows = prev.categories.map(c=>({
    name:c.name, emoji:c.emoji,
    planned:c.items.reduce((a,i)=>a+(+i.planned||0),0),
    actual: catA(c) - catD(c)
  }));
  const totalPlanned = rows.reduce((a,r)=>a+r.planned,0);
  const totalActual = rows.reduce((a,r)=>a+r.actual,0);
  const diff = totalPlanned - totalActual;
  const maxA = Math.max(1, ...rows.map(r=>r.actual));
  return `
  <section class="card">
    <div class="card-label">${state.prevYm.replace('-','년 ')}월 결산</div>
    <div class="big" style="margin-top:8px;color:${diff>=0?'var(--money)':'var(--warn)'}">${diff>=0?'+':''}${won(diff)}<span class="unit">원</span></div>
    <div class="tiny" style="margin-top:6px">계획 ${won(totalPlanned)}원 · 실제 ${won(totalActual)}원 ${diff>=0?'(남김)':'(초과)'}</div>
  </section>
  <section class="card">
    <div class="card-label" style="margin-bottom:12px">카테고리 비중</div>
    ${rows.map(r=>`
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:650">
          <span>${r.emoji} ${esc(r.name)}</span><span>${won(r.actual)}원</span>
        </div>
        <div class="bar" style="margin-top:6px"><i style="width:${Math.round(r.actual/maxA*100)}%;background:var(--money)"></i></div>
      </div>`).join('')}
  </section>`;
}

/* ============================================================
   이벤트 위임
   ============================================================ */
view.addEventListener('click', async e=>{
  const el = t => e.target.closest(`[${t}]`);
  let n;

  if((n=el('data-go'))){ const [tab,sub]=n.dataset.go.split('|'); return go(tab,sub); }
  if((n=el('data-sub'))){ const [tab,sub]=n.dataset.sub.split('|'); state.openRecipe=null; return go(tab,sub); }
  if((n=el('data-back'))){ state.openRecipe=null; return render(); }

  /* 식단 */
  if((n=el('data-recipe'))){ state.openRecipe=n.dataset.recipe; return go('meal','recipe'); }
  if((n=el('data-mealdone'))){ const s=n.dataset.mealdone; setMeal(TODAY,s,{done:!mealOf(TODAY,s).done}); return render(); }
  if((n=el('data-pick'))) return pickMenu(TODAY, n.dataset.pick);
  if((n=el('data-day'))) return pickDay(n.dataset.day);
  if((n=el('data-cal'))){
    const [y,m]=state.calMonth.split('-').map(Number); const d=new Date(y,m-1+Number(n.dataset.cal),1);
    state.calMonth = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
    if(!state.mealCache[state.calMonth]) state.mealCache[state.calMonth] = await DB.get(K.meals(state.calMonth)) || {};
    return render();
  }
  if((n=el('data-timer'))) return startTimer(Number(n.dataset.timer), n.dataset.tid);

  /* 운동 */
  if((n=el('data-check'))){
    const rec = workRec(TODAY), id = n.dataset.check;
    rec.done[id] = !rec.done[id]; saveWork(); return render();
  }
  if(el('data-finish')){ closeSheet(); return toastSheet('오늘 루틴 완주', '전부 체크했다. 기록 탭에서 체감 강도(RPE)를 남기면 다음 주 무게를 정하기 쉽다.'); }

  /* 돈 */
  if((n=el('data-fold'))){ const c=catById(n.dataset.fold); c.open=!c.open; saveBudget(); return render(); }
  if((n=el('data-del'))){ const [cid,iid]=n.dataset.del.split('|'); const c=catById(cid);
    c.items = c.items.filter(i=>i.id!==iid); saveBudget(); return render(); }
  if((n=el('data-additem'))){ const c=catById(n.dataset.additem);
    c.items.push({id:uid('item'),name:'새 항목',planned:0,actual:0,discount:0}); saveBudget(); return render(); }
  if(el('data-log')) return logSheet();
  if(el('data-review-open')) return reviewSheet(0);
});

view.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.amt){
    const [field,cid,iid] = t.dataset.amt.split('|');
    const it = catById(cid).items.find(i=>i.id===iid);
    it[field] = Number(t.value)||0; saveBudget(); return render();
  }
  if(t.dataset.rename){
    const [cid,iid] = t.dataset.rename.split('|');
    catById(cid).items.find(i=>i.id===iid).name = t.value.trim() || '이름 없음';
    saveBudget(); return;
  }
  if(t.dataset.closeAmt){
    const [field,cid] = t.dataset.closeAmt.split('|');
    catById(cid)[field] = Number(t.value)||0; saveBudget(); return render();
  }
  if(t.dataset.rpe){ workRec(t.dataset.rpe).rpe = t.value? Number(t.value):null; saveWork(); return; }
  if(t.dataset.weight){ state.settings.weight = Number(t.value)||70; saveSettings(); return render(); }
});

/* ============================================================
   시트들
   ============================================================ */
function pickMenu(date, slot){
  openSheet(`<h3>${slot==='lunch'?'점심':'저녁'} 메뉴 고르기</h3>` +
    MENUS.map(m=>`<button class="opt" data-setmenu="${date}|${slot}|${m.id}"
      aria-current="${mealOf(date,slot).menuId===m.id}">
      <span>${m.emoji} ${esc(m.name)}</span>
      <span class="tiny">단백질 ${m.protein}g · ${m.min}분</span></button>`).join('') +
    `<button class="btn ghost full" style="margin-top:8px" data-close="1">닫기</button>`);
}
function pickDay(date){
  const tracked = Schedule.mealsToday(date);
  const row = (slot,label)=>{
    if(!tracked.includes(slot)) return `<div class="opt" style="opacity:.6"><span>${label} · 근무 중 해결</span><span class="tiny">집에서 준비 안 함</span></div>`;
    const x = mealOf(date,slot), mm = menuById(x.menuId);
    return `<button class="opt" data-pickday="${date}|${slot}"><span>${label} · ${mm.emoji} ${esc(mm.name)}</span><span class="tiny">바꾸기</span></button>`;
  };
  openSheet(`<h3>${fmtDate(date)}</h3>
    ${row('lunch','점심')}
    ${row('dinner','저녁')}
    <button class="btn ghost full" style="margin-top:8px" data-close="1">닫기</button>`);
}
function logSheet(){
  const m = todayMealSummary();
  const trackable = m.tracked.filter(s=>s!=='breakfast');
  const nextMeal = trackable.find(s=>!m[s].done) || trackable[trackable.length-1];
  openSheet(`<h3>무엇을 기록할까</h3>
    <button class="opt" data-quick="meal"><span>${ic('utensils')} 식사 완료</span><span class="tiny">${nextMeal==='lunch'?'점심':nextMeal==='dinner'?'저녁':'아침'}</span></button>
    <button class="opt" data-quick="work"><span>${ic('dumbbell')} 운동 시작</span><span class="tiny">${routineFor(TODAY).title}</span></button>
    <button class="opt" data-quick="money"><span>${ic('wallet')} 결산 입력</span><span class="tiny">생활비 ${won(livingLeft())}원 남음</span></button>
    <button class="opt" data-quick="review"><span>${ic('review')} 오늘 회고</span><span class="tiny">${LifeReview.isComplete(state.review[TODAY])?'작성함':'네 가지 질문'}</span></button>
    <button class="btn ghost full" style="margin-top:8px" data-close="1">닫기</button>`);
}
function toastSheet(title, body){
  openSheet(`<h3>${esc(title)}</h3><div class="muted" style="margin-bottom:14px">${esc(body)}</div>
    <button class="btn work full" data-close="1">확인</button>`);
}

$('#sheet').addEventListener('click', e=>{
  const el = t => e.target.closest(`[${t}]`); let n;
  if(el('data-close')) return closeSheet();
  if((n=el('data-setmenu'))){
    const [date,slot,id]=n.dataset.setmenu.split('|');
    setMeal(date,slot,{menuId:id,done:false}); closeSheet(); return render();
  }
  if((n=el('data-pickday'))){ const [date,slot]=n.dataset.pickday.split('|'); return pickMenu(date,slot); }
  if((n=el('data-quick'))){
    const q = n.dataset.quick; closeSheet();
    if(q==='meal'){
      const m=todayMealSummary(); const trackable=m.tracked.filter(s=>s!=='breakfast');
      const next = trackable.find(s=>!m[s].done) || 'breakfast';
      setMeal(TODAY, next, {done:true}); return go('meal','today');
    }
    if(q==='work') return go('work','today');
    if(q==='money') return go('money','close');
    if(q==='review') return reviewSheet(0);
  }
});

/* ============================================================
   app/sync-ui.js — 동기화 배지와 토큰 설정
   ============================================================ */
store.subscribe(({pending, error})=>{
  const b = $('#syncBadge');
  const text = !syncCfg ? '동기화 꺼짐' : error==='auth' ? '토큰 확인' : pending ? `동기화 대기 ${pending}` : '';
  b.textContent = text; b.hidden = !text;
});
$('#syncBadge').addEventListener('click', async ()=>{
  if(syncCfg && store.pending() && store.error() !== 'auth'){   // 밀린 게 있으면 먼저 바로 보내 본다
    await store.flush();
    if(!store.pending()) return;
  }
  syncSheet();
});
function syncSheet(){
  const c = syncCfg || { repo:'sasaway/life', device:'' };
  openSheet(`<h3>동기화 설정</h3>
    <div class="card flat" style="background:var(--bg);margin-bottom:12px">
      <div class="tiny">실행 위치 · ${isStandalone()?'홈 화면 앱':'브라우저'}</div>
      <div class="tiny">저장 공간 · ${storageMode==='local'?'이 기기에 남음':'임시 — 닫으면 사라짐'}</div>
      <div class="tiny">보낼 기록 · ${store.pending()}건${store.lastError()?` — 마지막 실패: ${esc(store.lastError())}`:''}</div>
      <div class="tiny">동기화 설정 · ${syncCfg?`있음 (${esc(syncCfg.device)}, 토큰 …${esc(String(syncCfg.token).slice(-4))})`:'없음'}</div>
    </div>
    <div class="tiny" style="margin-bottom:10px">토큰은 이 ${isStandalone()?'홈 화면 앱':'브라우저'}에만 저장돼. 아이폰은 홈 화면 앱과 Safari 가 따로라서 각각 넣어야 해.</div>
    <label class="field" for="syncToken">GitHub 토큰</label>
    <input id="syncToken" class="inp" type="password" placeholder="github_pat_…" autocomplete="off" style="margin-bottom:12px">
    <label class="field" for="syncRepo">저장소</label>
    <input id="syncRepo" class="inp" value="${esc(c.repo)}" style="margin-bottom:12px">
    <label class="field" for="syncDevice">기기 이름</label>
    <input id="syncDevice" class="inp" value="${esc(c.device)}" placeholder="폰" style="margin-bottom:14px">
    <div id="syncMsg" class="tiny" role="status" style="color:var(--warn);margin-bottom:8px"></div>
    <button class="btn work full" data-sync-save="1">확인하고 저장</button>
    ${syncCfg?'<button class="btn ghost full" style="margin-top:8px" data-sync-off="1">동기화 끄기</button>':''}
    <button class="btn ghost full" style="margin-top:8px" data-close="1">닫기</button>`);
}
function isStandalone(){
  return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
async function saveSyncConfig(){
  const msg = t => { const el = $('#syncMsg'); if(el) el.textContent = t; };
  const token = $('#syncToken').value.trim() || (syncCfg && syncCfg.token);
  const repo = $('#syncRepo').value.trim(), device = $('#syncDevice').value.trim() || '기기';
  if(!token) return msg('토큰 칸이 비어 있어. 붙여 넣은 게 들어갔는지 한 번 봐 줘.');
  if(!repo) return msg('저장소 이름이 비어 있어.');
  if(storageMode !== 'local') return msg('여기선 설정을 저장할 수 없어. 개인정보 보호 모드인지 확인해 줘.');
  msg('토큰 확인하는 중…');
  const r = await LifeSync.checkToken({ token, repo });
  if(r === 'auth') return msg('토큰이 맞지 않아. 만료됐거나 일부만 붙여 넣었을 수 있어.');
  if(r === 'notfound') return msg(`토큰 권한에 ${repo} 가 없어. 발급할 때 저장소 선택을 확인해 줘.`);
  storage.setItem(SYNC_CFG, JSON.stringify({ token, repo, device }));   // network 면 일단 저장하고 나중에 보낸다
  if(storage.getItem(SYNC_CFG) === null) return msg('저장이 안 됐어. 브라우저 저장 공간 설정을 확인해 줘.');
  try { if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  location.reload();
}
$('#sheet').addEventListener('click', e=>{
  if(e.target.closest('[data-sync-save]')){
    saveSyncConfig();
    return;
  }
  if(e.target.closest('[data-sync-off]')){ storage.removeItem(SYNC_CFG); return location.reload(); }
});
window.addEventListener('online', ()=>store.flush());
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    // 홈 화면 앱은 며칠씩 떠 있다 — 날짜가 바뀌었으면 보낼 것을 보내고 오늘로 다시 연다
    if(ymd(new Date()) !== TODAY){ store.flush().finally(()=>location.reload()); return; }
    store.flush(); loadAll().then(render);
  }
  else store.flush();
});

/* ============================================================
   features/review/view.js — 오늘 회고 (질문 하나씩)
   ============================================================ */
function reviewSheet(i){
  const Q = LifeReview.QUESTIONS[i], rec = state.review[TODAY] || {};
  openSheet(`<h3>${esc(Q.q)}</h3>
    <div class="tiny" style="margin-bottom:8px">${i+1} / ${LifeReview.QUESTIONS.length}</div>
    <textarea id="reviewInput" class="inp" rows="4" aria-label="${esc(Q.q)}" style="font:inherit">${esc(rec[Q.id]||'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      ${i>0?`<button class="btn ghost" data-review-go="${i-1}">이전</button>`:''}
      <button class="btn line" data-review-none="${i}">없음</button>
      <button class="btn work" style="flex:1" data-review-next="${i}">${i<LifeReview.QUESTIONS.length-1?'다음':'저장'}</button>
    </div>`);
  setTimeout(()=>{ const t=$('#reviewInput'); if(t) t.focus(); }, 50);
}
function saveReviewAnswer(i, value){
  if(!LifeReview.isEditable(TODAY, ymd(new Date()))){
    toastSheet('날짜가 바뀌었어요', '지난 회고는 고칠 수 없어요. 앱을 새로 열어 주세요.');
    return false;
  }
  const id = LifeReview.QUESTIONS[i].id;
  state.review[TODAY] = { ...(state.review[TODAY]||{}), [id]: value, savedAt: new Date().toISOString() };
  saveReview();
  return true;
}
$('#sheet').addEventListener('click', e=>{
  const n = e.target.closest('[data-review-next],[data-review-none],[data-review-go]');
  if(!n) return;
  if(n.dataset.reviewGo !== undefined) return reviewSheet(+n.dataset.reviewGo);
  const i = +(n.dataset.reviewNext ?? n.dataset.reviewNone);
  const value = n.dataset.reviewNone !== undefined ? '없음' : $('#reviewInput').value;
  if(!saveReviewAnswer(i, value)) return;
  if(i < LifeReview.QUESTIONS.length-1) return reviewSheet(i+1);
  closeSheet(); render();
});

document.querySelectorAll('[data-ic]').forEach(el=>{ el.innerHTML = ic(el.dataset.ic, 22); });

/* 시작 */
(async ()=>{ await loadAll(); render(); store.flush(); })();   // 켤 때 밀린 기록부터 보낸다
</script>
